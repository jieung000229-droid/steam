name: 스팀 데이터 자동 갱신

on:
  schedule:
    - cron: "17 19 * * *"   # 매일 한국시간 새벽 4시 17분 (스팀 할인이 바뀌는 새벽 3시 직후)
    - cron: "17 7 * * *"    # 매일 한국시간 오후 4시 17분
  workflow_dispatch:         # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: steam-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 스팀에서 정보 가져오기
        run: python scripts/fetch_steam.py

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
